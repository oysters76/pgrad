repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: venv/bin/ruff format
        language: system
        types: [python]

      - id: ruff-check
        name: ruff check
        entry: venv/bin/ruff check --fix
        language: system
        types: [python]

      - id: pyright
        name: pyright
        entry: venv/bin/pyright
        language: system
        types: [python]
        pass_filenames: false
